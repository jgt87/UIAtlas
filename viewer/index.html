<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Atlas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/atlas.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <button id="menuBtn" type="button" class="ghost-btn menu-btn" aria-haspopup="dialog" aria-expanded="false" aria-controls="side">Menu</button>
    <div class="brand"><img class="logo" src="favicon.svg" alt="" width="24" height="24"> UI Atlas</div>
    <span class="pick-wrap"><select id="atlasPick" class="pick" aria-label="Atlas"></select></span><!-- its chevron: chevronIcon() in js/dom.js -->
    <button id="newItem" type="button" class="primary" aria-haspopup="dialog" aria-controls="new-item-dialog">+ New</button>
    <button id="exportBtn" type="button" class="ghost-btn" aria-haspopup="dialog" aria-controls="export-dialog" aria-disabled="true" aria-describedby="exportWhy">Export</button><!-- #exportWhy: its tooltip (js/tooltip.js) -->
    <span id="exportWhy" role="tooltip" class="tooltip" hidden>Export opens once an atlas has loaded</span>
    <div id="colorFmt" class="seg" role="radiogroup" aria-label="Colour notation"></div><!-- filled by segmented() in js/app.js -->
  </header>
  <div class="layout">
    <nav class="side" id="side" aria-label="Views">
      <a href="#/screens" data-nav="screens" class="navitem">Screens</a>
      <a href="#/tokens" data-nav="tokens" class="navitem">Design tokens</a>
      <a href="#/elements" data-nav="elements" class="navitem">Elements</a>
      <a href="#/components" data-nav="components" class="navitem">Components</a>
      <a href="#/map" data-nav="map" class="navitem">Map</a>
      <div class="meta" id="meta"></div>
    </nav>
    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <div class="content">
      <div class="toolbar"><input id="search" class="search" type="search" placeholder="Search screens, elements, tokens…" aria-label="Search"></div>
      <main id="main" class="main" tabindex="-1"></main>
      <!-- the view's live regions: mounted once, only their text changes (viewer/js/states.js announce) -->
      <p id="viewStatus" class="sr-only" role="status"></p>
      <p id="viewAlert" class="sr-only" role="alert"></p>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
